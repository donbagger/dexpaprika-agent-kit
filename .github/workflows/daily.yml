name: daily

# Runs every agent's DexPaprika calls against the live server, so the code in this repo is
# known to work today and not only on the day it was written.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python smoke.py

  market-chat:
    # Only where a model key is configured, so forks without one still go green.
    runs-on: ubuntu-latest
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.LLM_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.LLM_API_KEY != ''
        with:
          python-version: "3.13"
      - if: env.LLM_API_KEY != ''
        run: pip install -r requirements.txt
      - if: env.LLM_API_KEY != ''
        run: python market_chat.py "What are the top 3 pools on Base by 24h volume? Give their addresses."
